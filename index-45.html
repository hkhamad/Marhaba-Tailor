<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marhaba Tailor — Measurement Register</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#F7F2E9">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Marhaba Tailor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Amiri:wght@400;700&family=Lateef:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --urdu-font:'Noto Nastaliq Urdu', serif;
    --rs:1;
    --bg: #F7F2E9;
    --bg-2: #EFE7D6;
    --surface: #FFFFFF;
    --surface-2: #F5EEDF;
    --stitch: rgba(60,48,28,0.18);
    --gold: #B8863A;
    --gold-dim: #8f6a2e;
    --red: #B23A2E;
    --green: #4C7850;
    --cream: #2A2620;
    --muted: #7A7264;
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, #FFFDF8 0%, var(--bg) 60%),
      var(--bg);
    color: var(--cream);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 2px 18px;
    border-bottom:1px dashed var(--stitch);
    margin-bottom:20px;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:0.3px;
  }
  header h1 span{color:var(--gold);}
  header .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.5px;
  }

  .search-row{display:flex;gap:8px;margin-bottom:16px;}
  .backup-row{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:10px 0;flex-wrap:wrap;}
  .backup-row .btn{flex:none;}
  .btn.tiny{padding:5px 9px;font-size:11px;border-radius:3px;}
  .backup-folder-note{
    width:100%;
    text-align:right;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--muted);
    margin-top:-2px;
  }
  .backup-folder-note button{
    background:none;border:none;color:var(--gold-dim);font-family:inherit;font-size:10px;
    text-decoration:underline;cursor:pointer;padding:0;margin-inline-start:4px;
  }
  input[type=text], input[type=tel], input[type=date], input[type=number], textarea, select{
    width:100%;
    background:var(--surface);
    border:1px solid #DDD2BC;
    border-radius:var(--radius);
    color:var(--cream);
    padding:10px 12px;
    font-family:'Work Sans',sans-serif;
    font-size:14px;
    outline:none;
    transition:border-color .15s ease;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--gold);}
  ::placeholder{color:var(--muted);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--gold);
    color:#20180a;
    border:none;
    border-radius:var(--radius);
    padding:10px 16px;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{background:#a5762f;}
  .btn:active{transform:scale(0.97);}
  .btn.secondary{
    background:transparent;
    color:var(--cream);
    border:1px solid #DDD2BC;
  }
  .btn.secondary:hover{border-color:var(--gold);color:var(--gold);}
  .btn.danger{background:transparent;color:var(--red);border:1px solid #E3B7AE;font-weight:500;padding:8px 12px;font-size:13px;}
  .btn.plain{
    background:transparent;
    color:var(--gold-dim);
    border:none;
    padding:6px 4px;
    font-weight:500;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .btn.plain:hover{color:var(--gold);background:transparent;}
  .btn.plain:active{transform:none;}
  .btn.small{padding:7px 12px;font-size:13px;}
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }

  #addBtn{width:100%;padding:13px;font-size:15px;margin-bottom:18px;}

  .panel{
    background:var(--surface);
    border:1px solid #E3D9C4;
    border-radius:6px;
    padding:18px;
    margin-bottom:18px;
    animation:reveal .18s ease;
  }
  @keyframes reveal{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  .panel h2{
    font-family:'Fraunces',serif;
    font-size:18px;font-weight:600;margin:0 0 14px;color:var(--gold);
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field{margin-bottom:10px;}
  .field label{
    display:block;font-size:11px;color:var(--muted);margin-bottom:4px;
    font-family:'IBM Plex Mono',monospace;letter-spacing:0.3px;
  }
  .naap-title{
    font-size:12px;color:var(--muted);margin:14px 0 8px;
    border-top:1px dashed var(--stitch);padding-top:12px;
    font-family:'IBM Plex Mono',monospace;
  }
  .urdu{
    font-family:var(--urdu-font);
    direction:rtl;
    text-align:right;
  }
  .urdu-title{
    font-family:var(--urdu-font);
    font-size:20px;
    color:var(--gold);
    direction:rtl;
    text-align:right;
    margin:16px 0 10px;
    border-top:1px dashed var(--stitch);
    padding-top:14px;
  }
  .urdu-field{margin-bottom:12px;}
  .urdu-field label{
    display:block;font-size:16px;color:var(--cream);margin-bottom:5px;
    font-family:var(--urdu-font);
    direction:rtl;text-align:right;
  }
  .size-row{display:flex;align-items:center;gap:10px;direction:rtl;flex-wrap:wrap;}
  .size-input{width:90px;flex:0 0 auto;}
  .radio-row{
    display:flex;flex-wrap:wrap;gap:8px;direction:rtl;
  }
  .radio-pill{
    display:flex;align-items:center;gap:6px;
    background:var(--bg-2);border:1px solid #DDD2BC;border-radius:20px;
    padding:6px 14px;cursor:pointer;font-size:15px;
    font-family:var(--urdu-font);
    transition:border-color .15s ease, background .15s ease;
  }
  .radio-pill input{width:auto;margin:0;accent-color:var(--gold);}
  .radio-pill.checked{border-color:var(--gold);background:rgba(214,165,76,0.12);color:var(--gold);}
  .naap-item .v.urdu-v{font-family:var(--urdu-font);font-size:16px;direction:rtl;}
  .qty-stepper{display:flex;align-items:center;gap:10px;}
  .qty-stepper button{
    width:38px;height:38px;flex:0 0 auto;border-radius:50%;border:1px solid #DDD2BC;
    background:var(--bg-2);color:var(--cream);font-size:18px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
    transition:border-color .15s ease, background .15s ease;
  }
  .qty-stepper button:hover{border-color:var(--gold);color:var(--gold);}
  .qty-stepper button:active{transform:scale(0.93);}
  .qty-stepper input{
    width:56px;text-align:center;padding:8px 4px;font-family:'IBM Plex Mono',monospace;font-size:16px;
  }
  .price-box{
    background:var(--bg-2);border-radius:6px;padding:10px 14px;margin-bottom:10px;
  }
  .price-line{
    font-family:var(--urdu-font);font-size:14px;color:var(--muted);
    direction:rtl;text-align:right;display:flex;justify-content:space-between;
    padding:2px 0;
  }
  .price-total{
    font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--gold);font-weight:600;
    border-top:1px dashed var(--stitch);margin-top:6px;padding-top:6px;text-align:right;
  }
  .card-price{
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gold);
    background:rgba(214,165,76,0.1);padding:3px 10px;border-radius:12px;
    display:inline-block;margin-bottom:10px;
  }

  /* Image preview modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(30,24,14,0.45);
    display:flex;align-items:center;justify-content:center;z-index:100;
    padding:20px;
  }
  .modal-box{
    background:var(--surface);border-radius:10px;padding:16px;
    max-width:420px;width:100%;max-height:90vh;overflow-y:auto;
  }
  .modal-box img{width:100%;border-radius:6px;display:block;margin-bottom:14px;}
  .modal-actions{display:flex;gap:8px;flex-wrap:wrap;}

  /* Off-screen receipt template used for image generation */
  #cardTemplateRoot{position:fixed;left:-9999px;top:0;}
  .receipt{background:#fff;padding:10px;display:flex;font-family:var(--urdu-font);font-weight:700;}
  .receipt,.receipt *{color:#000 !important;opacity:1 !important;text-shadow:none;box-sizing:border-box;}
  .r-frame{flex:1;border:3px solid #000;display:flex;flex-direction:column;}
  .r-head{text-align:center;padding:12px 10px 8px;border-bottom:3px solid #000;}
  .r-logo{height:64px;width:auto;filter:grayscale(1) brightness(0);display:block;margin:0 auto 4px;}
  .r-head h2{margin:0;font:700 calc(30px*var(--rs))/1.2 'Fraunces',serif;}
  .r-owner{font:600 calc(16px*var(--rs)) 'Work Sans',sans-serif;margin-top:2px;letter-spacing:.5px;}
  .r-box{border-bottom:3px solid #000;}
  .r-box:last-child{border-bottom:0;}
  .r-tab{flex:1;display:flex;flex-direction:column;}
  .r-info{display:flex;align-items:center;border-bottom:1.5px solid #000;min-height:calc(46px*var(--rs));}
  .r-info:last-child{border-bottom:0;}
  .r-info .k{width:120px;align-self:stretch;display:flex;align-items:center;padding:0 8px;border-right:2px solid #000;font:600 calc(17px*var(--rs)) 'Work Sans',sans-serif;}
  .r-info .v{flex:1;text-align:center;padding:0 8px;font-size:calc(20px*var(--rs));line-height:1.9;unicode-bidi:plaintext;}
  .r-row{display:grid;grid-template-columns:46px 1fr 1.3fr;direction:rtl;flex:1 0 auto;min-height:calc(44px*var(--rs));border-bottom:1.5px solid #000;}
  .r-row:last-child{border-bottom:0;}
  .r-row.dt{direction:ltr;grid-template-columns:auto 1fr;column-gap:14px;flex:0 0 auto;min-height:calc(28px*var(--rs));}
  .r-row.dt .n{display:none;}
  .r-row.dt .k{border:0;}
  .r-row.dt>span{font:600 calc(13px*var(--rs))/1.4 'Work Sans',sans-serif;padding:2px 8px;}
  .r-row>span{display:flex;align-items:center;padding:0 8px;font-size:calc(20px*var(--rs));line-height:1.9;}
  .r-row .n{justify-content:center;font:600 calc(16px*var(--rs)) 'Work Sans',sans-serif;border-left:2px solid #000;}
  .r-row .k{border-left:2px solid #000;}
  .r-bl{display:flex;justify-content:space-between;align-items:center;direction:rtl;padding:0 12px;min-height:calc(42px*var(--rs));border-bottom:1.5px solid #000;font-size:calc(20px*var(--rs));line-height:1.9;}
  .r-bl:last-child{border-bottom:0;}
  .r-bl.note{white-space:pre-wrap;}
  .r-bl.tot{border-top:3px double #000;}
  .size-toggle{display:flex;gap:6px;margin-bottom:12px;}
  .size-toggle button{
    flex:1;background:var(--bg-2);border:1px solid #DDD2BC;border-radius:20px;
    padding:7px 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);
    cursor:pointer;transition:all .15s ease;
  }
  .size-toggle button.active{background:var(--gold);border-color:var(--gold);color:#20180a;font-weight:600;}
  .size-custom{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;}
  .stepper-group{display:flex;flex-direction:column;gap:4px;}
  .stepper-group label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .stepper{
    display:flex;align-items:center;gap:0;background:var(--bg-2);
    border:1px solid #DDD2BC;border-radius:6px;overflow:hidden;
  }
  .stepper button{
    background:transparent;border:none;color:var(--gold-dim);font-size:16px;font-weight:600;
    width:32px;height:32px;cursor:pointer;line-height:1;
  }
  .stepper button:active{background:rgba(184,134,58,0.15);}
  .stepper span{min-width:44px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--cream);}
  .size-custom .btn{flex:0 0 auto;}
  .panel-actions{display:flex;gap:8px;margin-top:6px;}

  .empty{
    text-align:center;padding:50px 20px;color:var(--muted);
  }
  .empty .icon{font-size:34px;margin-bottom:10px;opacity:0.6;}

  .card{
    background:var(--surface);
    border:1px solid #E3D9C4;
    border-radius:6px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .card-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;cursor:pointer;gap:10px;
  }
  .card-head:hover{background:var(--surface-2);}
  .card-name{font-weight:600;font-size:15px;}
  .card-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--muted);margin-top:2px;
  }
  .status{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:4px 9px 4px 16px;
    border-radius:2px 10px 10px 2px;
    position:relative;
    white-space:nowrap;
    letter-spacing:0.4px;
  }
  .status::before{
    content:'';position:absolute;left:6px;top:50%;transform:translateY(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--bg);
  }
  .status.pending{background:rgba(214,165,76,0.18);color:var(--gold);}
  .status.ready{background:rgba(110,155,114,0.2);color:var(--green);}
  .status.delivered{background:rgba(154,161,172,0.18);color:var(--muted);}

  .card-body{
    padding:0 16px 16px;
    border-top:1px dashed var(--stitch);
  }
  .naap-grid{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    gap:10px;margin:14px 0;
  }
  .naap-item{
    background:var(--bg-2);
    border-radius:4px;
    padding:8px 10px;
  }
  .naap-item .k{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);}
  .naap-item .v{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--green);margin-top:2px;}
  .notes{
    font-size:13px;color:var(--muted);margin:10px 0;line-height:1.5;
    white-space:pre-wrap;
  }
  .dates{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:12px;font-family:'IBM Plex Mono',monospace;}
  .card-actions{display:flex;flex-wrap:wrap;gap:8px;}

  select.status-select{width:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 10px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:#20180a;padding:10px 20px;border-radius:6px;
    font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(60,48,28,0.25);
    animation:toastIn .2s ease; z-index:50;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  .count-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .count-row .c{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}

  @media (max-width:400px){
    .naap-grid{grid-template-columns:1fr 1fr;}
    .grid2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;align-items:center;gap:12px;">
      <img src="logo-transparent.png" alt="Marhaba Tailor" style="height:52px;width:auto;">
      <div>
        <h1>Marhaba <span>Tailor</span></h1>
        <div class="tag">MEASUREMENT REGISTER &amp; ORDER TRACKER</div>
      </div>
    </div>
  </header>

  <button class="btn" id="addBtn" onclick="toggleForm()">+ Add New Customer</button>

  <div class="backup-row">
    <button class="btn secondary tiny" id="backupFolderBtn" onclick="chooseBackupFolder()">📁 Set Location</button>
    <button class="btn secondary tiny" onclick="openSettings()">⚙ Settings</button>
    <button class="btn secondary tiny" onclick="exportData()">📤 Backup</button>
    <button class="btn secondary tiny" onclick="document.getElementById('importFile').click()">📥 Restore</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none;" onchange="importData(event)">
    <div class="backup-folder-note" id="backupFolderNote" style="display:none;"></div>
  </div>

  <div id="formArea"></div>

  <div class="search-row">
    <input type="text" id="searchBox" placeholder="Search by name or number..." oninput="render()">
  </div>

  <div class="count-row">
    <span class="c" id="countLabel">Loading...</span>
  </div>

  <div id="list"></div>
</div>

<div id="cardTemplateRoot"></div>
<div id="modalRoot"></div>

<script>
let customers = [];
let formOpen = false;
let editingId = null;

const STORAGE_KEY = 'tailor_customers';
const DEFAULT_PRICES = {base:800,bakram:200,karachi:250,rang:150,chamak:150};
const SETTINGS_KEY = 'tailor_settings';
const FONTS = [['Nastaliq (Noto)',"'Noto Nastaliq Urdu', serif"],['Naskh (Noto)',"'Noto Naskh Arabic', serif"],['Amiri',"'Amiri', serif"],['Lateef',"'Lateef', serif"]];
const DEFAULT_SETTINGS = {prices:{...DEFAULT_PRICES}, font:FONTS[0][1], fontScale:100, accent:'#B8863A', fields:[]};
function mergeSettings(x){ x = x || {}; return {...DEFAULT_SETTINGS, ...x, prices:{...DEFAULT_PRICES, ...(x.prices||{})}, fields:Array.isArray(x.fields)?x.fields:[]}; }
let settings;
try{ settings = mergeSettings(JSON.parse(localStorage.getItem(SETTINGS_KEY))); }catch(e){ settings = mergeSettings(); }
let P = settings.prices;
function persistSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){} }
function applySettings(){
  const r = document.documentElement.style;
  r.setProperty('--urdu-font', settings.font);
  r.setProperty('--rs', settings.fontScale/100);
  r.setProperty('--gold', settings.accent);
  r.setProperty('--gold-dim', settings.accent);
}
let lastAutoPrice = null;

// ---- Backup folder memory (like remembering the chosen storage location) ----
let backupDirHandle = null;
const supportsFolderPicker = typeof window.showDirectoryPicker === 'function';

function idbHandleStore(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('marhaba_tailor_fs', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSetHandle(key, val){
  const db = await idbHandleStore();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(val, key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGetHandle(key){
  const db = await idbHandleStore();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}

function updateBackupFolderNote(){
  const note = document.getElementById('backupFolderNote');
  const btn = document.getElementById('backupFolderBtn');
  if(!note || !btn) return;
  if(!supportsFolderPicker){
    note.style.display = 'none';
    return;
  }
  if(backupDirHandle){
    note.style.display = 'block';
    note.innerHTML = `Location: 📁 ${backupDirHandle.name}<button onclick="chooseBackupFolder()">Change</button>`;
    btn.style.display = 'none';
  }else{
    note.style.display = 'none';
    btn.style.display = 'inline-flex';
  }
}

async function chooseBackupFolder(){
  if(!supportsFolderPicker){
    showToast("Your browser doesn't support this feature, backup will be saved to the Downloads folder");
    return;
  }
  try{
    const handle = await window.showDirectoryPicker({mode:'readwrite'});
    backupDirHandle = handle;
    await idbSetHandle('backupDir', handle);
    updateBackupFolderNote();
    showToast('This location has been remembered — every backup will save here now');
  }catch(e){
    // user cancelled or permission was denied
  }
}

async function restoreBackupFolder(){
  if(!supportsFolderPicker) return;
  try{
    const handle = await idbGetHandle('backupDir');
    if(handle) backupDirHandle = handle;
  }catch(e){
    backupDirHandle = null;
  }
  updateBackupFolderNote();
}

function computePrice(){
  let perUnit = P.base;
  let lines = [[`سوٹ (بنیادی چارجز)`, P.base]];
  const bakram = (document.querySelector('input[name="f_bakram"]:checked')||{}).value;
  const button = (document.querySelector('input[name="f_button"]:checked')||{}).value;
  const silai = (document.querySelector('input[name="f_silai"]:checked')||{}).value;
  if(bakram==='acha'){ perUnit+=P.bakram; lines.push(['بکرم اچھا', P.bakram]); }
  if(button==='karachi'){ perUnit+=P.karachi; lines.push(['کراچی بٹن', P.karachi]); }
  if(button==='rang'){ perUnit+=P.rang; lines.push(['رنگ بٹن', P.rang]); }
  if(silai==='chamak'){ perUnit+=P.chamak; lines.push(['چمک سلائی', P.chamak]); }
  const qtyInput = document.getElementById('f_qty');
  const qty = Math.max(1, Number(qtyInput ? qtyInput.value : 1) || 1);
  const total = perUnit * qty;
  return {total, lines, perUnit, qty};
}

function updatePrice(){
  const {total, lines, perUnit, qty} = computePrice();
  const box = document.getElementById('priceBreakdown');
  if(box){
    let html = lines.map(([label,amt])=>`<div class="price-line"><span>${label}</span><span>Rs ${amt}</span></div>`).join('');
    if(qty>1){
      html += `<div class="price-line"><span>فی سوٹ کل</span><span>Rs ${perUnit}</span></div>`;
      html += `<div class="price-line"><span>تعداد</span><span>× ${qty} سوٹ</span></div>`;
    }
    html += `<div class="price-total">کل: Rs ${total}</div>`;
    box.innerHTML = html;
  }
  const priceInput = document.getElementById('f_price');
  if(priceInput){
    if(priceInput.value === '' || Number(priceInput.value) === lastAutoPrice){
      priceInput.value = total;
    }
  }
  lastAutoPrice = total;
}

function changeQty(delta){
  const qtyInput = document.getElementById('f_qty');
  if(!qtyInput) return;
  const next = Math.max(1, (Number(qtyInput.value)||1) + delta);
  qtyInput.value = next;
  updatePrice();
}

function uid(){ return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

function pad2(n){ return String(n).padStart(2,'0'); }

async function exportData(){
  if(!customers.length){
    showToast("There's no data yet to back up");
    return;
  }
  const payload = {
    app: 'marhaba-tailor',
    exportedAt: new Date().toISOString(),
    customers: customers,
    settings: settings
  };
  const now = new Date();
  const fname = `marhaba-tailor-backup-${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}.json`;
  const text = JSON.stringify(payload, null, 2);

  // If a location (folder) is already remembered, save directly there
  if(backupDirHandle){
    try{
      let perm = await backupDirHandle.queryPermission({mode:'readwrite'});
      if(perm !== 'granted'){
        perm = await backupDirHandle.requestPermission({mode:'readwrite'});
      }
      if(perm === 'granted'){
        const fileHandle = await backupDirHandle.getFileHandle(fname, {create:true});
        const writable = await fileHandle.createWritable();
        await writable.write(text);
        await writable.close();
        showToast(`Backup saved to "${backupDirHandle.name}"`);
        return;
      }
    }catch(e){
      // agar folder access chala gaya ho (e.g. USB/SD card nikal di gayi), neeche fallback pe chale jayein
    }
  }

  // Fallback: normal browser download
  try{
    const blob = new Blob([text], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast('Backup file saved');
  }catch(e){
    showToast("Backup couldn't be saved");
  }
}

function importData(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      const incoming = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.customers) ? parsed.customers : null);
      if(!incoming){
        showToast("This isn't a valid backup file");
        event.target.value = '';
        return;
      }
      const ok = confirm(`This backup file contains ${incoming.length} customer(s). This will REPLACE your current data. Continue?`);
      if(!ok){
        event.target.value = '';
        return;
      }
      customers = incoming;
      if(parsed && parsed.settings && !Array.isArray(parsed)){ settings = mergeSettings(parsed.settings); P = settings.prices; persistSettings(); applySettings(); }
      saveData();
      render();
      showToast('Backup restored');
    }catch(err){
      showToast("Couldn't read the file, please choose a valid backup file");
    }finally{
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}

    orderDate: document.getElementById('f_orderDate').value,
    deliveryDate: document.getElementById('f_deliveryDate').value,
    notes: document.getElementById('f_notes').value.trim(),
  };

  if(id){
    const idx = customers.findIndex(x=>x.id===id);
    if(idx>-1){ customers[idx] = {...customers[idx], ...data}; }

  } else {

function buildMessage(c){

  }
  msg += ` شکریہ!`;
  return msg;
}

function sendMessage(c, via){
  const msg = encodeURIComponent(buildMessage(c));
  let phone = c.phone.replace(/[^0-9+]/g,'');
  if(via==='whatsapp'){
    if(phone.startsWith('0')) phone = '92' + phone.slice(1); // Pakistan default; adjust if needed
    window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
  } else {
    window.open(`sms:${c.phone}?body=${msg}`, '_blank');
  }
}

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatDateDMY(isoDate){
  if(!isoDate) return '';
  const parts = String(isoDate).split('-');
  if(parts.length !== 3) return isoDate;
  const [y, m, d] = parts;
  return `${d}/${m}/${y}`;
}

function computePriceFromData(c){
  const Q = c.prices || P;
  let perUnit = Q.base;
  let lines = [['سوٹ (بنیادی چارجز)', Q.base]];
  if(c.bakram==='acha'){ perUnit+=Q.bakram; lines.push(['بکرم اچھا', Q.bakram]); }
  if(c.button==='karachi'){ perUnit+=Q.karachi; lines.push(['کراچی بٹن', Q.karachi]); }
  if(c.button==='rang'){ perUnit+=Q.rang; lines.push(['رنگ بٹن', Q.rang]); }
  if(c.silai==='chamak'){ perUnit+=Q.chamak; lines.push(['چمک سلائی', Q.chamak]); }
  const qty = Math.max(1, Number(c.qty)||1);
  if(qty>1){
    lines.push(['فی سوٹ کل', perUnit]);
    lines.push(['تعداد', `× ${qty} سوٹ`]);
  }
  return lines;
}

    ['چھاتی', c.chati], ['چوڑائی', c.chorai], ['شلوار', c.shalwar], ['پانچہ', c.pancha],
    ['گلا'+(galaT?' ('+galaT+')':''), c.galaSize || (galaT?nb:'')], ['دامن', daamanLabel], ['کف'+(kafT?' ('+kafT+')':''), c.kafSize || (kafT?nb:'')],
    ['سلائی', silaiLabel], ['بکرم', bakramLabel], ['بٹن', buttonLabel], ['پاکٹ', pocketsLabel],
    ['تعداد', (Number(c.qty)>1 ? c.qty+' سوٹ' : '')], ...customEntries(c)
  ].filter(([k,v]) => v);

  const PX_PER_MM = 6.62;
  const widthPx = Math.round((widthMM||80) * PX_PER_MM);
  const lengthPx = Math.round((lengthMM||0) * PX_PER_MM);
  const sizeStyle = `width:${widthPx}px;${lengthPx ? `min-height:${lengthPx}px;` : ''}`;
  const isNum = v => /^[0-9\u0660-\u0669.\/\s+\-\u00BC\u00BD\u00BE]+$/.test(String(v));
  const ordered = [...entries.filter(e=>isNum(e[1])), ...entries.filter(e=>!isNum(e[1]))];
  const row = (n,k,v,cls='') => `<div class="r-row ${cls}"><span class="n">${n}</span><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const info = (k,v) => `<div class="r-info"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  let rows = ordered.map(([k,v],i)=>row(i+1,k,escapeHtml(v))).join('');
  for(let i=entries.length;i<14;i++) rows += row(i+1,'','');
  const dn = Math.max(entries.length,14);
  rows += row('','Booking Date',c.orderDate ? formatDateDMY(c.orderDate) : '','dt') + row('','Delivery Date',c.deliveryDate ? formatDateDMY(c.deliveryDate) : '','dt');
  const bl = (a,b,cls='') => `<div class="r-bl ${cls}"><span>${a}</span><span>${b}</span></div>`;
  const bill = (c.notes ? bl('نوٹ', escapeHtml(c.notes), 'note') : '')
    + (c.price ? computePriceFromData(c).map(([l,a])=>bl(l, typeof a==='number'?'Rs '+a:a)).join('') + bl('کل قیمت','Rs '+c.price,'tot') : '');
  return `
    <div class="receipt" style="${sizeStyle}"><div class="r-frame">
      <div class="r-head">
        <img src="logo-transparent.png" alt="" class="r-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <h2 style="display:none;">Marhaba Tailor</h2>
        <div class="r-owner">Sajjad Ali  ◆  0301-3335066</div>
      </div>
      <div class="r-box">
        ${info('Name:', escapeHtml(c.name))}${info('Contact:', escapeHtml(c.phone))}
      </div>
      <div class="r-box r-tab">${rows}</div>
      ${bill ? `<div class="r-box">${bill}</div>` : ''}
    </div></div>
  `;
}

let currentCardWidthMM = 80;
let currentCardLengthMM = 210;

async function generateNaapCard(id, widthMM, lengthMM){
  widthMM = widthMM || currentCardWidthMM;
  lengthMM = lengthMM !== undefined ? lengthMM : currentCardLengthMM;
  currentCardWidthMM = widthMM;
  currentCardLengthMM = lengthMM;
  const c = customers.find(x=>x.id===id);
  if(!c) return;
  if(typeof html2canvas === 'undefined'){
    showToast('Internet is needed to generate the image');
    return;
  }
  showToast('Generating card...');
  const root = document.getElementById('cardTemplateRoot');
  root.innerHTML = buildReceiptHTML(c, widthMM, lengthMM);
  // wait for fonts to be ready so Urdu text renders correctly
  try{ await document.fonts.load('700 20px ' + settings.font.split(',')[0]); await document.fonts.ready; }catch(e){}
  await new Promise(r => setTimeout(r, 150));
  try{
    const canvas = await html2canvas(root.querySelector('.receipt'), {backgroundColor:'#FFFFFF', scale:3});
    const dataUrl = canvas.toDataURL('image/png');
    showImageModal(dataUrl, c.name, id, widthMM, lengthMM);
  }catch(e){
    showToast("Couldn't generate the card, please try again");
  }
  root.innerHTML = '';
}

let tempWidthMM = 80;
let tempLengthMM = 210;

function stepCardSize(which, delta){
  if(which==='width'){
    tempWidthMM = Math.max(20, Math.min(300, tempWidthMM + delta));
    document.getElementById('widthVal').textContent = tempWidthMM;
  } else {
    tempLengthMM = Math.max(0, Math.min(600, tempLengthMM + delta));
    document.getElementById('lengthVal').textContent = tempLengthMM || 'Auto';
  }
}

function applyCustomCardSize(customerId){
  generateNaapCard(customerId, tempWidthMM, tempLengthMM);
}

function showImageModal(dataUrl, name, customerId, widthMM, lengthMM){
  widthMM = widthMM || 58;
  lengthMM = lengthMM || 0;
  tempWidthMM = widthMM;
  tempLengthMM = lengthMM;
  const root = document.getElementById('modalRoot');
  const sizeControlsHTML = customerId ? `
    <div class="size-toggle">
      <button class="${widthMM===58?'active':''}" onclick="generateNaapCard('${customerId}',58,0)">58mm</button>
      <button class="${widthMM===80?'active':''}" onclick="generateNaapCard('${customerId}',80,210)">80mm</button>
    </div>
    <div class="size-custom">
      <div class="stepper-group">
        <label>Width (mm)</label>
        <div class="stepper">
          <button type="button" onclick="stepCardSize('width',-2)">−</button>
          <span id="widthVal">${widthMM}</span>
          <button type="button" onclick="stepCardSize('width',2)">+</button>
        </div>
      </div>
      <div class="stepper-group">
        <label>Length (mm)</label>
        <div class="stepper">
          <button type="button" onclick="stepCardSize('length',-5)">−</button>
          <span id="lengthVal">${lengthMM || 'Auto'}</span>
          <button type="button" onclick="stepCardSize('length',5)">+</button>
        </div>
      </div>
      <button class="btn secondary small" onclick="applyCustomCardSize('${customerId}')">Apply</button>
    </div>
  ` : '';
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-box">
        ${sizeControlsHTML}
        <img src="${dataUrl}" alt="Measurement card">
        <div class="modal-actions">
          <button class="btn small" onclick="downloadImage('${dataUrl}', '${name.replace(/'/g,"")}')">⬇ Download</button>
          <button class="btn secondary small" onclick="shareImage('${dataUrl}', '${name.replace(/'/g,"")}')">Share</button>
          <button class="btn danger" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>
  `;
}

function customFieldsHTML(c){
  return settings.fields.map(f=>{
    const v = (c.custom||{})[f.id] || {};
    const size = f.mode!=='select' ? `<input type="text" class="urdu size-input" id="cf_${f.id}_s" placeholder="سائز" value="${escapeHtml(v.size||'')}">` : '';
    const opts = f.mode!=='size' ? `<div class="radio-row">${f.options.map(o=>`<label class="radio-pill ${v.opt===o?'checked':''}"><input type="radio" name="cf_${f.id}" value="${escapeHtml(o)}" ${v.opt===o?'checked':''} onchange="refreshPills(this)"> ${escapeHtml(o)}</label>`).join('')}</div>` : '';
    return `<div class="urdu-field"><label>${escapeHtml(f.label)}</label><div class="size-row">${size}${opts}</div></div>`;
  }).join('');
}
function collectCustom(id){
  const o = {...(((customers.find(x=>x.id===id))||{}).custom||{})};
  settings.fields.forEach(f=>{
    const si = document.getElementById(`cf_${f.id}_s`), r = document.querySelector(`input[name="cf_${f.id}"]:checked`);
    const size = si ? si.value.trim() : '', opt = r ? r.value : '';
    if(size||opt) o[f.id] = {size,opt}; else delete o[f.id];
  });
  return o;
}
function customEntries(c){
  return settings.fields.map(f=>{ const v = (c.custom||{})[f.id]; return [f.label, v ? [v.size,v.opt].filter(Boolean).join(' • ') : '']; });
}
function readSettingsInputs(){
  const g = id=>document.getElementById(id);
  ['base','bakram','karachi','rang','chamak'].forEach(k=>{ settings.prices[k] = Number(g('s_p_'+k).value) || 0; });
  settings.font = g('s_font').value;
  settings.fontScale = Math.min(160, Math.max(60, Number(g('s_scale').value) || 100));
  settings.accent = g('s_accent').value;
}
function openSettings(){
  const s = settings, pr = s.prices;
  const pf = (k,l)=>`<div class="field"><label>${l}</label><input type="number" id="s_p_${k}" value="${pr[k]}"></div>`;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal-box">
      <div class="naap-title" style="margin-top:0;border:0;padding:0;">PRICES (Rs)</div>
      <div class="grid2">${pf('base','SUIT BASE')}${pf('bakram','BAKRAM ACHA')}${pf('karachi','KARACHI BUTTON')}${pf('rang','RANG BUTTON')}${pf('chamak','CHAMAK SILAI')}</div>
      <div class="naap-title">LOOK</div>
      <div class="field"><label>URDU FONT (app + receipt)</label><select id="s_font">${FONTS.map(([n,v])=>`<option value="${v}" ${v===s.font?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="grid2">
        <div class="field"><label>RECEIPT TEXT SIZE %</label><input type="number" id="s_scale" min="60" max="160" value="${s.fontScale}"></div>
        <div class="field"><label>APP COLOR</label><input type="color" id="s_accent" value="${s.accent}" style="height:40px;padding:2px;"></div>
      </div>
      <div class="naap-title">CUSTOM NAAP / OPTIONS</div>
      ${s.fields.map((f,i)=>`<div class="price-line" style="direction:ltr;align-items:center;"><span>${escapeHtml(f.label)} — ${f.mode}${f.options.length?' ('+escapeHtml(f.options.join('، '))+')':''}</span><button class="btn danger" onclick="delField(${i})">✕</button></div>`).join('') || '<div class="card-sub">No custom fields yet</div>'}
      <div class="field" style="margin-top:10px;"><label>NEW FIELD NAME</label><input type="text" class="urdu" id="s_f_label"></div>
      <div class="grid2">
        <div class="field"><label>TYPE</label><select id="s_f_mode"><option value="size">Size only</option><option value="select">Select only</option><option value="both">Size + Select</option></select></div>
        <div class="field"><label>OPTIONS (comma ,)</label><input type="text" class="urdu" id="s_f_opts" placeholder="گول، چورس"></div>
      </div>
      <button class="btn secondary small" onclick="addField()">+ Add Field</button>
      <div class="modal-actions" style="margin-top:14px;"><button class="btn small" onclick="saveSettings()">Save</button><button class="btn danger" onclick="closeModal()">Close</button></div>
    </div></div>`;
}
function addField(){
  readSettingsInputs();
  const label = document.getElementById('s_f_label').value.trim();
  const mode = document.getElementById('s_f_mode').value;
  const options = document.getElementById('s_f_opts').value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);
  if(!label){ showToast('Field name is required'); return; }
  if(mode!=='size' && !options.length){ showToast('Add at least one option'); return; }
  settings.fields.push({id:'x'+Date.now().toString(36), label, mode, options: mode==='size' ? [] : options});
  persistSettings(); applySettings(); openSettings(); showToast('Field added');
}
function delField(i){
  if(!confirm('Remove this field from the form? Old saved values stay in backups.')) return;
  readSettingsInputs();
  settings.fields.splice(i,1);
  persistSettings(); openSettings();
}
function saveSettings(){
  readSettingsInputs();
  persistSettings(); applySettings(); closeModal(); render();
  if(document.getElementById('priceBreakdown')) updatePrice();
  showToast('Settings saved');
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

function downloadImage(dataUrl, name){
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `naap-${name || 'customer'}.png`;
  a.click();
}

async function shareImage(dataUrl, name){
  try{
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const file = new File([blob], `naap-${name || 'customer'}.png`, {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Measurement Card'});
    } else {
      downloadImage(dataUrl, name);
      showToast("Sharing isn't supported, image downloaded instead");
    }
  }catch(e){
    downloadImage(dataUrl, name);
  }
}

let expandedId = null;
function toggleExpand(id){
  expandedId = expandedId===id ? null : id;
  render();
}

function render(){
  const q = (document.getElementById('searchBox')?.value || '').toLowerCase().trim();
  const list = document.getElementById('list');
  const countLabel = document.getElementById('countLabel');

  const filtered = customers.filter(c =>
    !q || c.name.toLowerCase().includes(q) || c.phone.includes(q)
  );

  countLabel.textContent = `${customers.length} customer${customers.length!==1?'s':''} — ${customers.filter(c=>c.status==='pending').length} pending`;

  if(filtered.length===0){
    list.innerHTML = `<div class="empty"><div class="icon">📏</div>${customers.length===0 ? 'No customers added yet.<br>Start with the button above.' : 'No results found.'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(c => {
    const galaLabel = [c.galaSize, c.galaType==='bein' ? 'بین' : c.galaType==='collar' ? 'کالر' : ''].filter(Boolean).join(' • ');
    const daamanLabel = c.daaman==='kurta' ? 'کرتہ' : c.daaman==='gol' ? 'گول' : c.daaman==='chorus' ? 'چورس' : '';
    const kafLabel = [c.kafSize, c.kaf==='mehrab' ? 'مہراب' : c.kaf==='sada' ? 'سادہ' : c.kaf==='gol' ? 'گول' : c.kaf==='chorus' ? 'چورس' : ''].filter(Boolean).join(' • ');
    const silaiLabel = c.silai==='single' ? 'سنگل سلائی' : c.silai==='double' ? 'ڈبل سلائی' : c.silai==='chamak' ? 'چمک سلائی' : '';
    const bakramLabel = c.bakram==='normal' ? 'نارمل' : c.bakram==='acha' ? 'اچھا' : '';
    const buttonLabel = c.button==='karachi' ? 'کراچی بٹن' : c.button==='rang' ? 'رنگ بٹن' : c.button==='tuck' ? 'ٹک بٹن' : c.button==='sada' ? 'سادہ بٹن' : '';
    const pocketNames = {side:'سائیڈ پاکٹ', front:'فرنٹ پاکٹ', shalwar:'شلوار پاکٹ'};
    const pocketsLabel = (c.pockets||[]).map(p=>pocketNames[p]).join('، ');

    const naapEntries = [
      ['لمبائی', c.lambai], ['تیرا', c.tera], ['بازو', c.baazu],
      ['چھاتی', c.chati], ['چوڑائی', c.chorai], ['شلوار', c.shalwar], ['پانچہ', c.pancha],
      ['گلا', galaLabel], ['دامن', daamanLabel], ['کف', kafLabel],
      ['سلائی', silaiLabel], ['بکرم', bakramLabel], ['بٹن', buttonLabel], ['پاکٹ', pocketsLabel], ...customEntries(c)
    ].filter(([k,v]) => v);

    const expanded = expandedId === c.id;

    return `
      <div class="card">
        <div class="card-head" onclick="toggleExpand('${c.id}')">
          <div>
            <div class="card-name">${escapeHtml(c.name)}</div>
            <div class="card-sub">${escapeHtml(c.phone)}</div>
          </div>
          <span class="status ${c.status}">${statusLabel(c.status)}</span>
        </div>
        ${expanded ? `
        <div class="card-body">
          ${c.price ? `<div class="card-price">کل قیمت: Rs ${c.price}${Number(c.qty)>1 ? ` (${c.qty} سوٹ)` : ''}</div>` : ''}
          ${(c.orderDate || c.deliveryDate) ? `
          <div class="dates">
            ${c.orderDate ? `<span>ORDER: ${formatDateDMY(c.orderDate)}</span>` : ''}
            ${c.deliveryDate ? `<span>DELIVERY: ${formatDateDMY(c.deliveryDate)}</span>` : ''}
          </div>` : ''}
          ${naapEntries.length ? `
          <div class="naap-grid">
            ${naapEntries.map(([k,v])=>`<div class="naap-item"><div class="k urdu" style="font-size:12px;">${k}</div><div class="v urdu-v">${escapeHtml(v)}</div></div>`).join('')}
          </div>` : ''}
          ${c.notes ? `<div class="notes">${escapeHtml(c.notes)}</div>` : ''}

          <select class="status-select" onchange="setStatus('${c.id}', this.value)">
            <option value="pending" ${c.status==='pending'?'selected':''}>Pending</option>
            <option value="ready" ${c.status==='ready'?'selected':''}>Ready</option>
            <option value="delivered" ${c.status==='delivered'?'selected':''}>Delivered</option>
          </select>

          <div class="card-actions" style="margin-top:12px;">
            <button class="btn small" onclick="sendMessage(customers.find(x=>x.id==='${c.id}'), 'whatsapp')">Send via WhatsApp</button>
            <button class="btn secondary small" onclick="sendMessage(customers.find(x=>x.id==='${c.id}'), 'sms')">Send via SMS</button>
            <button class="btn secondary small" onclick="editCustomer('${c.id}')">Edit</button>
            <button class="btn danger" onclick="deleteCustomer('${c.id}')">Delete</button>
          </div>
          <div class="card-actions" style="margin-top:8px;">
            <button class="btn small" style="background:var(--green);color:#0f1a10;" onclick="generateNaapCard('${c.id}')">📸 Generate Measurement Card</button>
          </div>
        </div>` : ''}
      </div>
    `;
  }).join('');
}

applySettings();
loadData();
restoreBackupFolder();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
